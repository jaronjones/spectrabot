# SpectraBot configuration
# Installed location: ~/.spectrabot/config.toml

[github]
# Repos to scan, "owner/repo" format.
repos = [
  # "octocat/hello-world",
]

# Developer credentials SpectraBot can post reviews as. Each PR is reviewed by
# the first developer in this list whose login is NOT the PR author — so no one
# reviews their own PR ("first eligible, not the author"). List your team in
# the order you want them tried.
#
# Leave this section out entirely (or empty) to keep single-user behavior:
# SpectraBot reviews with whatever identity `gh` is already authenticated as.
#
# Each token needs `repo` scope, plus SSO authorization for SSO-protected orgs.
# Keep this file private: chmod 600 ~/.spectrabot/config.toml
# [[github.developers]]
# login = "alice"
# token = "ghp_REPLACE_ME_ALICE"
#
# [[github.developers]]
# login = "bob"
# token = "ghp_REPLACE_ME_BOB"

[review]
# How to translate the model's recommendation into a GitHub review event.
#   "auto"    = approve / request-changes / comment based on the verdict
#   "comment" = always file as comment-only regardless of verdict
mode = "auto"

# GitHub usernames whose PRs should be skipped (bots, etc).
# Note: GitHub blocks approving your own PR, so when you authored a PR
# SpectraBot automatically downgrades the event to COMMENT even in "auto" mode.
skip_authors = []

# What to do when every configured [[github.developers]] is the PR's own
# author, so no one is eligible to post a non-self review:
#   "comment" = post the review as comment-only (default)
#   "skip"    = skip the PR entirely, posting nothing
author_fallback = "comment"

# Self-token repo override. Repos listed in self_review_repos are reviewed
# with self_token — the operator's own GitHub token — instead of the
# [[github.developers]] rotation. Use this for repos you want reviewed under
# your own identity. self_review_repos defaults to empty, which leaves the
# multi-developer behavior unchanged. If self_review_repos is non-empty,
# self_token must be set or SpectraBot aborts at startup.
#
# self_token needs `repo` scope (plus SSO authorization for SSO-protected
# orgs), like every developer token. Keep this file private: chmod 600.
# self_token = "ghp_REPLACE_ME_SELF"
self_review_repos = []

# Hard cap on PRs reviewed in a single scan. Protects against runaway token
# spend if many PRs land at once. Set to 0 for no cap.
max_prs_per_scan = 10

# If the unified diff exceeds this many lines, the PR is too large to review
# in one shot — SpectraBot posts a short "your PR is huge" COMMENT instead of
# a full review. 0 = no limit (always attempt a full review).
max_diff_lines = 4000

[engine]
# Which agent CLI runs the review. One of: "claude", "codex", "opencode".
# Each engine needs its own auth configured separately.
name = "claude"

# Path to the engine CLI. Leave empty to look `name` up on PATH.
bin = ""

# Extra args appended to the engine invocation.
# Example (claude): extra_args = ["--model", "claude-sonnet-4-6"]
extra_args = []

# Per-PR timeout in seconds.
timeout_seconds = 600
